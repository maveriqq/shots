<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kestrel Cockpit — drive, lift, fly, land</title>
<meta name="description" content="Concept cockpit for a fictional roadable eVTOL. Nine pre-flight checks become one lift ladder.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0C0D0C;--glass:rgba(13,15,14,.8);--ln:rgba(236,237,233,.09);--ln2:rgba(236,237,233,.16);--ln3:rgba(236,237,233,.26);
--tx:#F1F2EE;--t2:#A8ABA5;--t3:#74776F;--fd:#E651D8;--fd-ink:#1B0619;--ok:#5BD38A;--cau:#F0C24B;--adv:#5CC8DE;
--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tx);font:400 14px/1.45 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fd);outline-offset:3px;border-radius:8px}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tab{font-variant-numeric:tabular-nums}
.i{width:16px;height:16px;flex:none}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--t3);font-size:13px;z-index:1;transition:opacity .6s}

/* header */
.top{position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:24px;padding:0 28px;background:linear-gradient(180deg,rgba(12,13,12,.92),rgba(12,13,12,.6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--t2);font-size:13px;z-index:10;border-bottom:1px solid var(--ln);white-space:nowrap}
.wm{font-weight:600;letter-spacing:.28em;font-size:13px;color:var(--tx)}
.top .sep{width:1px;height:16px;background:var(--ln2)}
.live{display:flex;gap:8px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.modes{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:10px;padding:3px;position:relative}
.modes button{position:relative;z-index:1;padding:6px 16px;border-radius:7px;font-size:12.5px;color:var(--t2);transition:color .25s}
.modes button[aria-current="step"]{color:var(--tx)}
.modes .pill{position:absolute;top:3px;bottom:3px;border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--ln2);transition:left .5s var(--ease),width .5s var(--ease)}

/* layers */
.layer{position:fixed;z-index:5;transition:opacity .55s var(--ease),transform .55s var(--ease),filter .55s var(--ease)}
.layer.off{opacity:0;transform:translateY(10px);filter:blur(4px);pointer-events:none}
.panel{background:var(--glass);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);border:1px solid var(--ln);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px -24px rgba(0,0,0,.6)}
#left{left:24px;top:80px;width:360px;max-height:calc(100vh - 200px);overflow:auto;padding:24px;scrollbar-width:none}
#right{right:24px;top:80px;width:320px;padding:22px}
.state{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.state .dot{box-shadow:0 0 0 4px rgba(91,211,138,.15)}
.state.cau .dot{background:var(--cau);box-shadow:0 0 0 4px rgba(240,194,75,.15)}
.state.run .dot{background:var(--tx);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
h1.t{font-weight:300;font-size:36px;letter-spacing:-.035em;line-height:1.02;margin:14px 0 10px}
p.sub{color:var(--t2);font-size:13.5px}
p.sub b{color:var(--tx);font-weight:500}
.eb{font-size:12.5px;color:var(--t3);display:flex;justify-content:space-between;align-items:center}

/* groups */
.groups{margin-top:20px;border-top:1px solid var(--ln)}
.g{border-bottom:1px solid var(--ln)}
.gh{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;padding:8px 0}
.gh .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--t3);position:relative;flex:none;transition:background .3s,color .3s}
.g[data-s="ok"] .ic{background:rgba(91,211,138,.12);color:var(--ok)}
.g[data-s="cau"] .ic{background:rgba(240,194,75,.14);color:var(--cau)}
.g .ic .spin{width:18px;height:18px;animation:spin .9s linear infinite}
.g .ic .spin circle{fill:none;stroke-width:2.2;stroke-linecap:round}
.g .ic .spin .bg{stroke:rgba(255,255,255,.12)}.g .ic .spin .fg{stroke:var(--tx);stroke-dasharray:14 60}
@keyframes spin{to{transform:rotate(360deg)}}
.gh b{font-weight:500;font-size:14px;display:block}
.gh small{display:block;color:var(--t2);font-size:12px}
.g[data-s="cau"] .gh small{color:var(--cau)}
.gh .n{margin-left:auto;font-size:11.5px;color:var(--t3)}
.gh .chev{color:var(--t3);transition:transform .3s var(--ease)}
.g.open .gh .chev{transform:rotate(180deg)}
.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.g.open .gb{grid-template-rows:1fr}
.gb>div{overflow:hidden}
.row{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 0 7px 42px;color:var(--t2)}
.row .v{margin-left:auto;color:var(--tx);font-size:12.5px;text-align:right}
.row[data-s="cau"] .v{color:var(--cau)}
.row[data-s="run"] .v{color:var(--t3)}
.row[data-s="idle"] .v{color:var(--t3)}
.reason{margin:4px 0 6px 42px;font-size:13px;color:var(--tx)}
.choice{margin:8px 0 14px 42px;border:1px solid var(--ln2);border-radius:12px;overflow:hidden}
.choice .hd,.choice button{display:grid;grid-template-columns:1.1fr 1fr .9fr .9fr;gap:6px;width:100%;padding:9px 12px;font-size:12px;text-align:left;align-items:center}
.choice .hd{color:var(--t3);background:rgba(255,255,255,.03)}
.choice button{border-top:1px solid var(--ln);font-size:13px;transition:background .2s}
.choice button:hover{background:rgba(255,255,255,.04)}
.choice button[aria-pressed="true"]{background:rgba(230,81,216,.12);box-shadow:inset 3px 0 0 var(--fd)}
.choice button b{font-weight:500}
.choice .tag{font-size:11px;color:var(--t3);display:block}

/* trip card */
.route{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-weight:500}
.route i{flex:1;height:1px;background:linear-gradient(90deg,var(--tx),var(--fd));position:relative}
.route i::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--fd)}
.big{display:flex;align-items:baseline;gap:8px;margin-top:20px}
.big .v{font-size:72px;font-weight:200;letter-spacing:-.06em;line-height:.85}
.big .u{font-size:15px;color:var(--t2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border-radius:12px;overflow:hidden;margin-top:18px}
.kv div{background:rgba(20,22,21,.92);padding:11px 14px}
.kv span{display:block;font-size:11.5px;color:var(--t3)}
.kv b{display:block;font-weight:400;font-size:18px;letter-spacing:-.02em;margin-top:2px;transition:color .3s}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--ln);font-size:13px}
.list .li:first-child{border-top:0}
.list .li span:first-child{color:var(--t2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 8px;border-radius:999px}
.badge.ok{background:rgba(91,211,138,.12);color:var(--ok)}.badge.cau{background:rgba(240,194,75,.12);color:var(--cau)}
.pads{margin-top:18px;display:grid;gap:8px}
.pad{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--ln2);border-radius:12px;transition:border-color .2s,background .2s,box-shadow .2s}
.pad:hover{background:rgba(255,255,255,.04)}
.pad[aria-pressed="true"]{border-color:var(--fd);box-shadow:0 0 0 3px rgba(230,81,216,.14);background:rgba(230,81,216,.06)}
.pad b{font-weight:500}.pad small{color:var(--t2);font-size:12px;display:block;margin-top:2px}
.pad .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--t2);white-space:nowrap}
.pad .r small{display:block}

/* drive speed */
.speed{display:flex;align-items:baseline;gap:8px;margin:20px 0 4px}
.speed .v{font-size:96px;font-weight:200;letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums}
.speed .u{color:var(--t2);font-size:15px}

/* flight overlay */
#trip{left:32px;top:84px;max-width:480px;text-shadow:0 1px 14px rgba(10,14,16,.5)}
.pillst{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(14,16,15,.8);backdrop-filter:blur(12px);border:1px solid var(--ln);text-shadow:none}
.pillst .dot{box-shadow:0 0 0 4px rgba(91,211,138,.18)}
#trip h2{font-weight:400;font-size:28px;letter-spacing:-.025em;line-height:1.1;margin:14px 0 6px;color:#fff}
#trip p{font-size:15px;color:rgba(255,255,255,.88)}
#trip p b{font-weight:500;color:#fff}
.next{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:8px 14px 8px 8px;border-radius:12px;background:rgba(14,16,15,.82);backdrop-filter:blur(12px);border:1px solid var(--ln);text-shadow:none;transition:opacity .4s}
.next .ar{width:30px;height:30px;border-radius:8px;background:rgba(230,81,216,.16);color:var(--fd);display:grid;place-items:center}
.next b{font-weight:500;font-size:14px;display:block}.next small{font-size:12px;color:var(--t2)}
.scrim{position:fixed;z-index:4;pointer-events:none;transition:opacity .6s}
.scrim.tl{left:-140px;top:10px;width:800px;height:380px;background:radial-gradient(closest-side,rgba(12,16,18,.45),rgba(12,16,18,0))}
.scrim.sl{left:-170px;top:210px;width:460px;height:340px;background:radial-gradient(closest-side,rgba(12,16,18,.4),rgba(12,16,18,0))}
.scrim.sr{right:-170px;top:210px;width:500px;height:340px;background:radial-gradient(closest-side,rgba(12,16,18,.4),rgba(12,16,18,0))}
.gauge{top:322px;display:flex;flex-direction:column;gap:6px;color:#fff;text-shadow:0 1px 20px rgba(20,24,26,.4)}
.gauge .v{font-size:92px;font-weight:200;letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums}
.gauge .l{font-size:13px;color:rgba(255,255,255,.85)}
.gauge .l b{font-weight:500;color:#fff}
#gSpd{left:32px}#gAlt{right:32px;align-items:flex-end;text-align:right}
.ruler{top:258px;width:30px;height:250px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.55) 0 1px,transparent 1px 25px);-webkit-mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.ruler::after{content:"";position:absolute;top:124px;height:2px;width:30px;background:#fff}
#rulL{left:0}#rulR{right:0}

/* dock */
#dock{left:24px;right:24px;bottom:24px;min-height:96px;display:flex;align-items:center;gap:20px;padding:14px 16px 14px 14px}
#dock .msg{font-size:13.5px;color:var(--t2);min-width:0}
#dock .msg b{color:var(--tx);font-weight:500}
.acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{height:46px;padding:0 20px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,transform .15s,opacity .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--fd);color:var(--fd-ink);font-weight:600}
.btn.p:hover{background:#EE6BE2}
.btn.g{border:1px solid var(--ln2);color:var(--t2)}
.btn.g:hover{color:var(--tx);border-color:var(--ln3)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.hold{--p:0;position:relative;width:400px;height:64px;border-radius:32px;background:rgba(255,255,255,.04);border:1px solid var(--ln2);display:flex;align-items:center;gap:12px;padding:0 9px 0 26px;color:var(--t2);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;flex:none;transition:border-color .3s,color .3s,box-shadow .3s}
.hold::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(230,81,216,.3),rgba(230,81,216,.1));transform-origin:left;transform:scaleX(var(--p))}
.hold>*{position:relative}
.hold small{font-size:12px;color:var(--t3)}
.hold .k{margin-left:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--t3);transition:background .3s,color .3s}
.hold .k .i{width:20px;height:20px}
.hold[data-ready="true"]{border-color:rgba(230,81,216,.6);color:var(--tx);box-shadow:0 0 0 6px rgba(230,81,216,.07)}
.hold[data-ready="true"] .k{background:var(--fd);color:var(--fd-ink)}
.hold[aria-disabled="true"]{cursor:not-allowed}
.prog{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,rgba(230,81,216,.5),var(--fd))}
.prog s{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#565955;transform:translate(-50%,-50%)}
.prog em{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(230,81,216,.35);transform:translate(-50%,-50%)}
.wps{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:9px}
.fcol{padding:0 20px;border-right:1px solid var(--ln);min-height:60px;display:flex;flex-direction:column;justify-content:center}
.fcol:last-child{border-right:0}
.fcol.grow{flex:1.6}.fcol.mid{flex:1}
.stat b{font-weight:300;font-size:26px;letter-spacing:-.03em}
.stat small{font-size:12.5px;color:var(--t2);margin-left:6px}
.okst{display:flex;align-items:center;gap:10px;font-size:13.5px}
.okst .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(91,211,138,.12);color:var(--ok);flex:none}
.okst small{display:block;font-size:12px;color:var(--t2)}
#instr{right:24px;bottom:140px;width:300px;padding:16px 18px}
#instr .list .li span:last-child{font-family:'Geist Mono',monospace}

/* chips in scene */
#chips{position:fixed;inset:0;z-index:4;pointer-events:none}
.chip{position:absolute;left:0;top:0;font-size:11.5px;color:#EDEEEA;background:rgba(12,13,12,.74);backdrop-filter:blur(8px);border:1px solid var(--ln);padding:4px 9px;border-radius:999px;white-space:nowrap;display:flex;gap:6px;align-items:center;transition:opacity .4s;will-change:transform}
.chip .num{color:var(--t2)}
.chip.dest{background:rgba(230,81,216,.92);color:#fff;border-color:transparent;font-weight:500;padding:6px 12px}
.chip.dest .num{color:rgba(255,255,255,.85)}
.chip.man{border-color:rgba(230,81,216,.6)}
.chip.trf::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--adv)}
.chip.lm{background:transparent;border:0;backdrop-filter:none;color:rgba(255,255,255,.9);font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.45);font-size:12px}
.chip.hide{opacity:0}

.toast{position:fixed;left:50%;bottom:200px;transform:translate(-50%,14px);opacity:0;background:rgba(30,33,32,.95);border:1px solid var(--ln2);border-radius:12px;padding:11px 16px;display:flex;gap:10px;align-items:center;font-size:13.5px;transition:opacity .25s,transform .35s var(--ease);z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--ok)}
.hint{position:fixed;right:28px;bottom:5px;z-index:6;font-size:11.5px;color:rgba(255,255,255,.45);pointer-events:none}


/* corridor decision card */
#decide{left:0;right:0;margin:0 auto;bottom:194px;width:560px;max-width:calc(100vw - 48px);padding:18px 18px 16px;border-color:rgba(240,194,75,.35)}
#decide .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#decide .hd b{font-weight:500;font-size:17px;letter-spacing:-.01em}
#decide .hd span{font-size:13px;color:var(--t2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{text-align:left;border:1px solid var(--ln2);border-radius:14px;padding:11px 14px;transition:border-color .2s,background .2s,box-shadow .2s,transform .15s}
.tile:hover{background:rgba(255,255,255,.04)}.tile:active{transform:scale(.99)}
.tile[aria-pressed="true"]{border-color:var(--fd);background:rgba(230,81,216,.1);box-shadow:0 0 0 3px rgba(230,81,216,.14)}
.tile .tt{display:flex;justify-content:space-between;align-items:baseline}
.tile .tt b{font-weight:600;font-size:15px}.tile .tt span{font-size:12.5px;color:var(--t2)}
.tile .when{font-size:24px;font-weight:300;letter-spacing:-.03em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.tile .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--t3)}
.tile .rows b{display:block;color:var(--tx);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums;margin-top:1px}

/* ignition module */
#dock.tall{min-height:158px;display:grid;grid-template-columns:1fr auto 1fr;padding:10px 18px 28px;transition:background .3s,border-color .3s}
#dock.tall .msg{max-width:320px}
#dock.tall .acts{justify-self:end}
#dock.charging{background:linear-gradient(90deg,rgba(13,15,14,.82) 15%,rgba(230,81,216,calc(.06 + var(--p,0) * .22)) 50%,rgba(13,15,14,.82) 85%);border-color:rgba(230,81,216,calc(.12 + var(--p,0) * .5))}
.ign{display:flex;align-items:center;gap:26px}
.ign-read{width:120px;text-align:right;opacity:.45;transition:opacity .3s}
.ign-read.r{text-align:left}
.ign-read span{display:block;font-size:11.5px;color:var(--t3);letter-spacing:.02em}
.ign-read b{display:block;font-family:'Geist Mono',monospace;font-weight:400;font-size:22px;color:var(--t2);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px;transition:color .2s}
.ign[data-st="ready"] .ign-read,.ign[data-st="hold"] .ign-read,.ign[data-st="go"] .ign-read{opacity:1}
.ign[data-st="hold"] .ign-read b,.ign[data-st="go"] .ign-read b{color:#fff}
.ign-core{position:relative;width:132px;height:132px;perspective:520px;flex:none}
.ign-core svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .tk{stroke:rgba(255,255,255,.13);stroke-width:2.2;stroke-linecap:round;transition:stroke .12s}
.ring .tk.on{stroke:var(--fd)}
.ring .arc{fill:none;stroke:var(--fd);stroke-width:3;stroke-linecap:round;opacity:.0;transition:opacity .2s}
.ign[data-st="hold"] .ring .arc,.ign[data-st="go"] .ring .arc{opacity:1}
.ign-btn{position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle at 50% 32%,#3b3e3f,#17191a 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.55);display:grid;place-items:center;color:var(--t3);transition:background .4s,color .4s,box-shadow .4s,transform .15s;user-select:none;-webkit-user-select:none;touch-action:none}
.ign-btn .i{width:30px;height:30px}
.ign-btn small{position:absolute;bottom:17px;font-size:9.5px;letter-spacing:.16em;font-weight:600}
.ign[data-st="ready"] .ign-btn,.ign[data-st="hold"] .ign-btn,.ign[data-st="go"] .ign-btn{background:radial-gradient(circle at 50% 30%,#f48ae9,#c22aa9 72%);color:var(--fd-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 6px rgba(230,81,216,.14),0 0 46px rgba(230,81,216,.45);cursor:pointer}
.ign[data-st="ready"] .ign-btn{animation:ignBreathe 2.4s ease-in-out infinite}

<script>
/* Kestrel V — procedural model + shared helpers (three.js r128). Front = +x, up = +y. */
const K = (() => {
  const T = THREE;
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const sgnPow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);
  const cap = (u, p) => Math.pow(Math.max(0, 1 - Math.pow(Math.abs(u), p)), 1 / p);

  /* loft: superellipse cross-sections along x */
  function loft({ L, x0 = 0, nu = 160, nv = 96, hw, top, bot, n, taper }) {
    const pos = [], idx = [];
    for (let i = 0; i <= nu; i++) {
      const u = -1 + 2 * i / nu, x = x0 + u * L;
      const yt = top(u), yb = bot(u), mid = (yt + yb) / 2, hh = (yt - yb) / 2, w = hw(u), ne = n(u);
      for (let j = 0; j <= nv; j++) {
        const th = j / nv * Math.PI * 2, ny = sgnPow(Math.sin(th), 2 / ne), nz = sgnPow(Math.cos(th), 2 / ne);
        const tz = taper ? taper(u, ny) : 1;
        pos.push(x, mid + ny * hh, nz * w * tz);
      }
    }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const a = i * (nv + 1) + j, b = a + nv + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    return g;
  }
  function surf(spec, u, ny) {
    const yt = spec.top(u), yb = spec.bot(u), ne = spec.n(u);
    const nz = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(ny), ne)), 1 / ne);
    return new T.Vector3((spec.x0 || 0) + u * spec.L, (yt + yb) / 2 + ny * (yt - yb) / 2, nz * spec.hw(u) * (spec.taper ? spec.taper(u, ny) : 1));
  }

  function envMap(renderer, top = '#e9e8e4', mid = '#8e8b85', low = '#2a2927') {
    const s = new T.Scene();
    const sg = new T.SphereGeometry(50, 64, 32), c = [];
    const ct = new T.Color(top).convertSRGBToLinear(), cm = new T.Color(mid).convertSRGBToLinear(), cl = new T.Color(low).convertSRGBToLinear(), p = sg.attributes.position;
    for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 50; const col = y > 0 ? cm.clone().lerp(ct, Math.pow(y, .6)) : cm.clone().lerp(cl, Math.pow(-y, .45)); c.push(col.r, col.g, col.b); }
    sg.setAttribute('color', new T.Float32BufferAttribute(c, 3));
    s.add(new T.Mesh(sg, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide })));
    const soft = (w, h, x, y, z, k) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(k, k, k), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
    soft(34, 6, -14, 34, 6, 2.2); soft(8, 30, 30, 14, -12, 1.1); soft(50, 2.0, 0, 7, 42, 1.4); soft(50, 2.0, 0, 7, -42, .8);
    const band = new T.Mesh(new T.CylinderGeometry(48, 48, 7, 64, 1, true), new T.MeshBasicMaterial({ color: new T.Color(.05, .05, .05), side: T.BackSide })); band.position.y = 1; s.add(band);
    const pm = new T.PMREMGenerator(renderer); const rt = pm.fromScene(s, .015); pm.dispose();
    return rt.texture;
  }

  function materials(env) {
    return {
      paint: new T.MeshPhysicalMaterial({ color: '#A7AAA8', metalness: .58, roughness: .24, clearcoat: 1, clearcoatRoughness: .04, envMap: env, envMapIntensity: 1.25 }),
      lower: new T.MeshPhysicalMaterial({ color: '#232626', metalness: .5, roughness: .42, clearcoat: .5, envMap: env, envMapIntensity: .7 }),
      glass: new T.MeshPhysicalMaterial({ color: '#05080A', metalness: .15, roughness: .03, clearcoat: 1, clearcoatRoughness: .02, envMap: env, envMapIntensity: .7, transparent: true, opacity: .9, depthWrite: false }),
      crease: new T.MeshPhysicalMaterial({ color: '#16191A', metalness: .8, roughness: .3, envMap: env }),
      tire: new T.MeshStandardMaterial({ color: '#141515', roughness: .88 }),
      rim: new T.MeshStandardMaterial({ color: '#2F3333', metalness: .85, roughness: .32, envMap: env }),
      rimFace: new T.MeshStandardMaterial({ color: '#A6A8A4', metalness: .95, roughness: .22, envMap: env }),
      seat: new T.MeshStandardMaterial({ color: '#25211E', roughness: .75 }),
      person: new T.MeshStandardMaterial({ color: '#2E2926', roughness: .85 }),
      duct: new T.MeshPhysicalMaterial({ color: '#2A2D2D', metalness: .55, roughness: .38, clearcoat: .7, clearcoatRoughness: .2, envMap: env, side: T.DoubleSide }),
      lip: new T.MeshPhysicalMaterial({ color: '#4A4E4E', metalness: .8, roughness: .25, clearcoat: 1, envMap: env }),
      ductIn: new T.MeshStandardMaterial({ color: '#151717', roughness: .7, side: T.DoubleSide }),
      blade: new T.MeshStandardMaterial({ color: '#1d2020', metalness: .3, roughness: .5 }),
      blur: new T.MeshBasicMaterial({ color: '#3a3f40', transparent: true, opacity: .32, depthWrite: false, side: T.DoubleSide }),
      arm: new T.MeshPhysicalMaterial({ color: '#2A2D2D', metalness: .6, roughness: .32, clearcoat: .6, envMap: env }),
      lightF: new T.MeshBasicMaterial({ color: '#F4F7FF' }),
      lightR: new T.MeshBasicMaterial({ color: '#FF3B30' })
    };
  }

  function tube(points, r, mat) { return new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(points), points.length * 3, r, 8), mat); }

  function kestrel(env) {
    const M = materials(env), car = new T.Group();
    const L = 2.5, W = .98;
    const bot0 = u => .3 + .05 * Math.pow(Math.max(u, 0), 2);
    const top0 = u => .97 - .25 * sm(.32, 1.0, u) - .06 * sm(.55, 1, -u);
    const body = {
      L, nu: 180, nv: 110,
      hw: u => W * cap(u, u > 0 ? 3.4 : 4.2) * (1 - .07 * Math.max(u, 0)),
      bot: u => { const b = bot0(u), t = top0(u), m = (t + b) / 2; return m + (b - m) * cap(u, 7); },
      top: u => { const b = bot0(u), t = top0(u), m = (t + b) / 2; return m + (t - m) * cap(u, 7); },
      n: () => 5.2,
      taper: (u, ny) => 1 - .08 * Math.max(ny, 0)
    };
    const shell = new T.Mesh(loft(body), M.paint); shell.castShadow = true; shell.receiveShadow = true; car.add(shell);
    const sill = {
      L: L * .985, nu: 120, nv: 80,
      hw: u => body.hw(u) * 1.012,
      top: u => body.bot(u) + .16 * cap(u, 6), bot: u => body.bot(u) - .005,
      n: () => 6
    };
    const sl = new T.Mesh(loft(sill), M.lower); sl.castShadow = true; car.add(sl);
    const gx0 = -.32, gL = 1.42;
    const glassSpec = {
      L: gL, x0: gx0, nu: 120, nv: 90,
      hw: u => W * .9 * cap(u, 3.6),
      bot: u => top0((gx0 + u * gL) / L) - .24,
      top: u => { const base = top0((gx0 + u * gL) / L) - .02; const k = (1 - sm(.12, 1.0, u)) * (1 - sm(.45, 1.0, -u)); return base + (1.43 - base) * Math.max(k, .02); },
      n: () => 3.6,
      taper: (u, ny) => 1 - .24 * Math.max(ny, 0)
    };
    const glass = new T.Mesh(loft(glassSpec), M.glass); glass.renderOrder = 2; car.add(glass);
    [1, -1].forEach(s => {
      const pts = []; for (let k = 0; k <= 30; k++) { const u = -.88 + k / 30 * 1.7; const p = surf(body, u, .62); p.z = p.z * s + .004 * s; pts.push(p); }
      car.add(tube(pts, .012, M.crease));
    });
    const bar = (ny, uFrom, mat, r) => {
      const pts = [];
      for (let k = 0; k <= 40; k++) { const t = k / 40 * 2 - 1, s = t < 0 ? -1 : 1; const u = uFrom + (Math.sign(uFrom) * .995 - uFrom) * (1 - Math.pow(Math.abs(t), 1.6)); const p = surf(body, u, ny); p.z *= s; p.x += Math.sign(uFrom) * .006; pts.push(p); }
      car.add(tube(pts, r, mat));
    };
    bar(.38, .8, M.lightF, .016); bar(.5, -.86, M.lightR, .018);
    [[1.62, 1], [1.62, -1], [-1.6, 1], [-1.6, -1]].forEach(([x, s]) => {
      const side = surf(body, x / L, -.2).z;
      const w = new T.Group();
      const tire = new T.Mesh(new T.CylinderGeometry(.41, .41, .27, 48), M.tire); tire.rotation.x = Math.PI / 2; tire.castShadow = true; w.add(tire);
      const rim = new T.Mesh(new T.CylinderGeometry(.3, .3, .275, 48), M.rim); rim.rotation.x = Math.PI / 2; w.add(rim);
      const face = new T.Mesh(new T.CircleGeometry(.27, 48), M.rimFace); face.position.z = .14 * s; if (s < 0) face.rotation.y = Math.PI; w.add(face);
      for (let k = 0; k < 6; k++) { const sp = new T.Mesh(new T.BoxGeometry(.05, .24, .01), M.rim); sp.position.z = .148 * s; sp.rotation.z = k / 6 * Math.PI * 2; sp.translateY(.11); w.add(sp); }
      w.position.set(x, .41, s * (side - .11)); car.add(w);
      const arch = new T.Mesh(new T.TorusGeometry(.5, .035, 10, 48, Math.PI), M.lower); arch.position.set(x, .43, s * (side + .004)); car.add(arch);
    });
    [.42, -.42].forEach(z => {
      const seat = new T.Mesh(new T.BoxGeometry(.12, .55, .46), M.seat); seat.position.set(-.72, 1.02, z); seat.rotation.z = .22; car.add(seat);
      const head = new T.Mesh(new T.SphereGeometry(.11, 24, 16), M.person); head.position.set(-.55, 1.27, z); car.add(head);
      const torso = new T.Mesh(new T.SphereGeometry(.17, 16, 12), M.person); torso.position.set(-.58, 1.0, z); torso.scale.set(1, 1.3, 1.1); car.add(torso);
    });
    const rotors = [];
    [[1.18, 1], [1.18, -1], [-1.22, 1], [-1.22, -1]].forEach(([px, s]) => {
      const sh = surf(body, px / L, .55);
      const pivot = new T.Group(); pivot.position.set(px, sh.y, s * (sh.z - .04)); car.add(pivot);
      const front = px > 0 ? 1 : -1;
      const T1 = new T.Vector3(front * .98, .14, s * 1.36);          // deployed
      const T0 = new T.Vector3(front * .12, -.06, -s * .3);          // stowed inside the body shoulder
      const len0 = T1.length();
      const arm = new T.Mesh(new T.CylinderGeometry(.065, .085, len0, 20), M.arm); arm.castShadow = true; pivot.add(arm);
      const hinge = new T.Mesh(new T.SphereGeometry(.12, 20, 14), M.arm); hinge.scale.set(1.3, .8, 1); pivot.add(hinge);
      const fan = new T.Group(); pivot.add(fan);
      const R = .84;
      const wall = new T.Mesh(new T.CylinderGeometry(R + .05, R + .07, .26, 96, 1, true), M.duct); wall.castShadow = true; fan.add(wall);

    <div class="big"><span class="v tab">${S.corr ? dur : '14–16'}</span><span class="u">min by air</span></div>

/* corridor decision: a card right above the take-off control */
function renderDecide(ph) {
  const on = (ph === 'blocked') && S.mode === 'lift';
  L.decide.classList.toggle('off', !on); if (!on) return;
  const w = S.corr === 'C7' ? fmtWait(S.wait) : '1:52';
  L.decide.innerHTML = `<div class="hd"><b>${S.corr === 'C7' ? 'Waiting for corridor C7' : 'Corridor C7 is busy'}</b><span>Both land at 14:48. Leave now, or wait and keep 3% more battery.</span></div>
    <div class="tiles" role="group" aria-label="Choose a corridor">
      <button class="tile" data-c="C7" aria-pressed="${S.corr === 'C7'}"><div class="tt"><b>C7</b><span>${S.corr === 'C7' ? 'waiting' : 'wait'}</span></div><div class="when">in ${w}</div><div class="rows"><span>Leaves<b>14:34</b></span><span>Lands<b>14:48</b></span><span>Battery<b>31%</b></span></div></button>
      <button class="tile" data-c="C9" aria-pressed="${S.corr === 'C9'}"><div class="tt"><b>C9</b><span>open now</span></div><div class="when">now</div><div class="rows"><span>Leaves<b>14:32</b></span><span>Lands<b>14:48</b></span><span>Battery<b>28%</b></span></div></button>
    </div>`;
  $$('#decide .tile').forEach(b => b.onclick = () => pickCorr(b.dataset.c));
}

/* take-off control: a guarded ignition button. Holding it spins the rotors up in the scene. */
const IGN_MS = 1600, TICKS = 48;
function ignHTML() {
  let ticks = ''; for (let i = 0; i < TICKS; i++) { const a = -Math.PI / 2 + i / TICKS * Math.PI * 2, r1 = 60, r2 = i % 4 ? 64 : 67; ticks += `<line class="tk" x1="${66 + Math.cos(a) * r1}" y1="${66 + Math.sin(a) * r1}" x2="${66 + Math.cos(a) * r2}" y2="${66 + Math.sin(a) * r2}"/>`; }
  return `<div class="ign" data-st="locked">
    <div class="ign-read"><span>ROTORS</span><b id="igR">idle</b></div>
    <div class="ign-core"><svg class="ring" viewBox="0 0 132 132" aria-hidden="true">${ticks}<circle class="arc" cx="66" cy="66" r="55" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 66 66)"/></svg>
      <div class="ign-btn" role="button" tabindex="0" aria-label="Hold to take off"><svg class="i"><use href="#i-plane-departure"/></svg><small>LIFT</small></div>
      <div class="ign-cover" aria-hidden="true"><i></i>LOCKED<i></i></div>
      <span class="ign-cap" id="igCap">Hold 1.6 s</span></div>
    <div class="ign-read r"><span>LIFT POWER</span><b id="igP">0 kW</b></div></div>`;
}
function setIgn(p) {
  const ign = $('#dock .ign'); if (!ign) return;
  L.dock.style.setProperty('--p', p.toFixed(3));
  const n = Math.round(p * TICKS); $$('#dock .tk').forEach((t, i) => t.classList.toggle('on', i < n));
  $('#dock .arc').setAttribute('stroke-dasharray', `${(p * 100).toFixed(1)} 100`);
  $('#igR').textContent = p > 0 ? fmt(p * 2840) + ' rpm' : (S.chk.arms === 'ok' || ud.fold > .9 ? 'idle' : 'stowed');
  $('#igP').textContent = fmt(p * 412) + ' kW';
}
function renderIgnition(ph) {
  const msg = { checks: `<b>Pre-flight running.</b> The guard opens when all nine checks are green.`, blocked: S.corr === 'C7' ? `<b>Waiting for C7.</b> Opens in ${fmtWait(S.wait)}.` : '<b>One decision left.</b> Pick a corridor above.', ready: '<b>Guard open.</b> Hold the button to spin up and lift off. Release to cancel.', takeoff: '<b>Lifting off.</b> Stand clear of the pad.' }[ph];
  const st = ph === 'ready' ? 'ready' : ph === 'takeoff' ? 'go' : 'locked';
  if (!$('#dock .ign')) {
    L.dock.classList.add('tall');
    L.dock.innerHTML = `<p class="msg"></p>${ignHTML()}<div class="acts"><button class="btn g" id="bStay">Stay on road</button></div>`;
    $('#bStay').onclick = () => { RUN++; spinTarget = 0; foldTo(0, 1200); enterDrive('origin'); S.drive.parked = true; renderDrive(); toast('Lift cancelled. Slot released for the next car'); };
    bindIgnition($('#dock .ign-btn'));
  }
  const ign = $('#dock .ign'); if (ign.dataset.st !== 'hold') ign.dataset.st = st;
  $('#dock .msg').innerHTML = msg;
  $('#bStay').style.visibility = ph === 'takeoff' ? 'hidden' : 'visible';
  $('#igCap').textContent = ph === 'takeoff' ? 'Lifting off' : ph === 'ready' ? 'Hold 1.6 s' : ph === 'blocked' ? 'Corridor needed' : `Check ${CHECKS.filter(c => S.chk[c.id] === 'ok').length} of 9`;
  $('.ign-btn').setAttribute('aria-disabled', ph !== 'ready');
  if (ph !== 'takeoff' && ign.dataset.st !== 'hold') setIgn(0);
}
function bindIgnition(btn) {
  let raf = 0, st = 0, active = false;
  const ign = () => $('#dock .ign');
  const tick = t => { const p = Math.min((t - st) / IGN_MS, 1); setIgn(p); spinTarget = 62 * p; $('#igCap').textContent = p < 1 ? `Spinning up ${Math.round(p * 100)}%` : 'Lifting off'; if (p < 1) raf = requestAnimationFrame(tick); else finish(); };
  const finish = () => { active = false; cancelAnimationFrame(raf); setIgn(1); ign().dataset.st = 'go'; L.dock.classList.remove('charging'); doTakeoff(); };
  const start = e => { e && e.preventDefault(); if (active || S.phase === 'takeoff') return; if (liftPhase() !== 'ready') { toast(S.chk.slot === 'cau' ? 'Choose a corridor first' : 'Checks are still running'); return; }
    active = true; st = performance.now(); ign().dataset.st = 'hold'; L.dock.classList.add('charging'); raf = requestAnimationFrame(tick); };
  const stop = () => { if (!active) return; if (performance.now() - st >= IGN_MS) { finish(); return; }
    active = false; cancelAnimationFrame(raf); spinTarget = 0; ign().dataset.st = 'ready'; L.dock.classList.remove('charging'); setIgn(0); $('#igCap').textContent = 'Hold 1.6 s'; };
  btn.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
}

/* ================= TAKEOFF & FLIGHT ================= */
let spinTarget = 0;
async function doTakeoff() {
  RUN++; S.phase = 'takeoff'; S.open = {}; renderLift(); spinTarget = 62;
  await sleep(450);
  S.fly.s = 0; S.fly.v = 0; S.fly.active = true;
}
function enterFlightUI() {
  setMode('flight'); S.phase = 'cruise';
  show(['trip', 'gSpd', 'gAlt', 'rulL', 'rulR', 'dock', 'sTL', 'sSL', 'sSR']);
  renderFlightDock();
}
function renderFlightDock() {
  const app = S.phase === 'approach' || S.phase === 'hold';
  L.dock.innerHTML = `<div class="fcol grow" style="padding-left:8px"><div class="eb" style="margin-bottom:8px"><span>Santa Monica to Pasadena</span><span class="num" id="fTogo">22.6 mi, 16 min to go</span></div>
      <div class="prog"><i id="fBar" style="width:0%"></i><s style="left:0"></s><s style="left:${(S_TURN / FPL * 100).toFixed(1)}%"></s><s style="left:62%"></s><s style="left:100%"></s><em id="fDot" style="left:0%"></em></div>
      <div class="wps"><span>SM-04</span><span>Bend</span><span>Glendale</span><span>PA-11</span></div></div>
    <div class="fcol mid stat"><div class="eb" style="margin-bottom:4px">Battery</div><div><b class="tab" id="fBatt">78%</b><small>${CORR[S.corr || 'C9'].arr}% at landing</small></div></div>
    <div class="fcol mid">${app ? `<button class="btn p" id="bConf"><svg class="i"><use href="#i-helicopter-landing"/></svg>Confirm landing pad</button>` : `<div class="okst"><span class="ic"><svg class="i"><use href="#i-check"/></svg></span><div>No action needed<small>Kestrel is flying the corridor</small></div></div>`}</div>
    <div class="fcol"><button class="btn g" id="bInstr" aria-pressed="${S.instr}">${S.instr ? 'Hide instruments' : 'Flight instruments'}</button></div>`;
  $('#bInstr').onclick = () => { S.instr = !S.instr; L.instr.classList.toggle('off', !S.instr); renderFlightDock(); };
  const bc = $('#bConf'); if (bc) bc.onclick = () => enterLand();
}
function flightUpdate(dt) {
  const F = S.fly; if (!F.active || S.mode === 'land' || S.mode === 'drive') return;
  const s = F.s;
  const vt = s < 30 ? 6.5 : s < 1000 ? mix(6.5, 240, sm(30, 1000, s)) : s > S_APP ? mix(240, 30, sm(S_APP, FPL, s)) : 240;
  F.v = mix(F.v, vt, 1 - Math.exp(-dt * 2.2)); F.s = Math.min(FPL, s + F.v * dt);
  const p = atS(F.s); car.position.copy(p);
  const ahead = atS(F.s + 160), hdg = Math.atan2(-(ahead.z - p.z), ahead.x - p.x);
  const prevYaw = car.rotation.y, tgt = mix(PAD_YAW, hdg, sm(4, 90, F.s));
  car.rotation.y = mix(prevYaw, tgt, 1 - Math.exp(-dt * 3)); car.rotation.z = clamp((car.rotation.y - prevYaw) / Math.max(dt, .001) * -1.2, -.12, .12) * sm(20, 100, p.y);
  car.rotation.x = 0;
  if (S.phase === 'takeoff' && p.y > 30) enterFlightUI();
  if (S.mode !== 'flight') return;
  if (S.phase === 'cruise' && F.s >= S_APP) { S.phase = 'approach'; renderFlightDock(); toast('Approaching Pasadena. Confirm the landing pad'); }
  if (S.phase === 'approach' && F.s >= FPL - .5) { S.phase = 'hold'; }
  // live values
  const frac = F.s / FPL, dur = CORR[S.corr].dur, mins = CORR[S.corr].liftMin + frac * dur;
  setClock(14 * 60 + mins);
  const remMi = (FPL - F.s) * MI, remMin = Math.max(0, Math.ceil(dur * (1 - frac)));
  const kt = Math.round(F.v / 240 * 92 + (F.v > 200 ? Math.sin(S.t * .5) * 1.2 : 0)), ft = Math.round(p.y * 3.281 / 10) * 10;
  $('#vSpd').textContent = kt; $('#vAlt').textContent = fmt(ft); $('#vAltL').textContent = p.y < 450 ? 'climbing to 1,500' : `corridor ${S.corr}`;
  const arr = CORR[S.corr].arr, bat = Math.round(78 - (78 - arr - 1) * (.16 * sm(0, .09, frac) + .84 * frac));
  const tg = $('#fTogo'); if (tg) { tg.textContent = `${remMi.toFixed(1)} mi, ${remMin} min to go`; $('#fBar').style.width = (frac * 100) + '%'; $('#fDot').style.left = (frac * 100) + '%'; $('#fBatt').textContent = bat + '%'; }
  const where = p.z > -1500 ? 'Over Santa Monica' : p.z > -3600 ? 'Over West Hollywood' : p.z > -6800 ? 'Passing Griffith Park' : p.z > -9800 ? 'Over Glendale' : 'Over Pasadena';
  setWhere(where); $('#temp').textContent = p.y > 300 ? '17 °C' : '19 °C';
  const head = p.y < 440 ? 'Climbing out of Santa Monica' : F.s < S_TURN ? 'Approaching the bend over Hollywood' : p.z > -6800 ? 'Approaching Griffith Park' : S.phase === 'cruise' ? 'Over Glendale' : 'Approaching Pasadena';
  $('#fHead').textContent = head;
  $('#fSub').innerHTML = `Pasadena at <b>14:48</b>, ${remMi.toFixed(1)} mi and ${remMin} min to go.`;
  let nt, ns, ic = 'corner-up-right';
  if (p.y < 440) { nt = 'Climb to 1,500 ft'; ns = `Corridor ${S.corr}, then bear right`; ic = 'plane-departure'; }
  else if (F.s < S_TURN) { nt = `Bear right in ${((S_TURN - F.s) * MI).toFixed(1)} mi`; ns = `Corridor ${S.corr} turns toward Pasadena, heading 058° to 071°`; }
  else if (F.s < S_APP) { nt = `Stay on ${S.corr} for ${((S_APP - F.s) * MI).toFixed(1)} mi`; ns = 'Then descend toward PA-11'; ic = 'route'; }
  else { nt = 'Confirm the landing pad'; ns = 'PA-11 is clear. Kestrel holds over Pasadena until you confirm'; ic = 'helicopter-landing'; }
  $('#fNextT').textContent = nt; $('#fNextS').textContent = ns; $('#fNextIc').setAttribute('href', '#i-' + ic);
  $('#fState').textContent = S.phase === 'hold' ? 'Holding over Pasadena' : 'Autonomous flight';
  const cd = document.getElementById('cDestT'); if (cd) cd.textContent = remMin + ' min';
  const cm = document.getElementById('cManT'); if (cm) cm.textContent = ((S_TURN - F.s) * MI).toFixed(1) + ' mi';

    const vs = p.y < 450 ? Math.round(F.v * 60 * 3.281 * Math.max(0, tanS(F.s).y) / 10) * 10 : Math.round(Math.sin(S.t * .7) * 30);
    L.instr.innerHTML = `<div class="eb" style="margin-bottom:8px">Flight instruments</div><div class="list"><div class="li"><span>Heading</span><span>${String(Math.round(((90 - car.rotation.y * 180 / Math.PI) % 360 + 360) % 360)).padStart(3, '0')}°</span></div><div class="li"><span>Vertical speed</span><span>${vs > 0 ? '+' : ''}${fmt(vs)} fpm</span></div><div class="li"><span>Bank</span><span>${(car.rotation.z * -57.3).toFixed(1)}°</span></div><div class="li"><span>Rotor speed</span><span>${fmt(ud.rpm / 62 * 2840)} rpm</span></div><div class="li"><span>Squawk</span><span>4521</span></div></div>`;
  }
}

/* ================= LAND ================= */
function enterLand() {
  RUN++; setMode('land'); S.phase = 'select'; S.land.k = 0; S.instr = false; S.fly.active = false;
  show(['left', 'right', 'dock']); renderLand(true);
}
function renderLand(first) {
  const p = PADS.find(x => x.id === S.land.pad), busy = S.phase === 'descent' || S.phase === 'touch';
  const arr = CORR[S.corr || 'C9'].arr;
  L.left.innerHTML = `<span class="state ${busy ? 'run' : ''}"><span class="dot"></span>${busy ? 'Descending, hands off' : 'Holding over Pasadena'}</span>
    <h1 class="t">${busy ? `Landing at ${p.id}` : 'Choose where to land'}</h1>
    <p class="sub">${busy ? 'Kestrel flies the approach. The pad is scanned again 60 ft above it.' : p.state === 'ok' ? `<b>${p.id}</b> is clear. ${p.drive[0].toUpperCase() + p.drive.slice(1)}.` : `<b>${p.id}</b> is occupied until 14:52. Pick another pad or wait.`}</p>
    <div class="pads" role="group" aria-label="Landing pads">${PADS.map(x => `<button class="pad" data-p="${x.id}" aria-pressed="${x.id === p.id}" ${busy ? 'disabled' : ''}><div><b>${x.id} <span style="color:var(--t2);font-weight:400">${x.name}</span></b><span class="badge ${x.state}" style="margin-top:6px">${x.note}</span></div><div class="r tab">${x.dist}<small>${arr + x.batt}% left</small></div></button>`).join('')}</div>`;
  $$('#left .pad').forEach(b => b.onclick = () => { if (S.phase !== 'select') return; S.land.pad = b.dataset.p; renderLand(); });
  L.right.innerHTML = `<div class="eb">Touchdown checks</div><div class="list" style="margin-top:6px">
    <div class="li"><span>Wheels locked</span><span style="color:var(--ok)">ready</span></div>
    <div class="li"><span>Pad lidar scan</span><span style="color:var(--${p.state === 'ok' ? 'ok' : 'cau'})">${p.state === 'ok' ? 'clear, 4 s ago' : 'car on pad'}</span></div>
    <div class="li"><span>Crosswind</span><span class="tab">${p.wind}</span></div>
    <div class="li"><span>Battery at touchdown</span><span class="tab">${arr + p.batt}%</span></div></div>
    <p class="sub" style="margin-top:14px;font-size:12.5px">Rotors stow 12 s after touchdown, then you drive off the pad.</p>`;
  const ready = p.state === 'ok' && !busy;
  const msg = busy ? `<b>Descending</b> to ${p.id}.` : ready ? `<b>${p.id}</b> confirmed. Hold to start the descent.` : `<b>${p.id}</b> is occupied. Descent locked.`;
  const ex = $('#dock .hold');
  if (first || !ex || ex.dataset.ph !== (busy ? 'b' : 's')) {
    L.dock.innerHTML = `${holdHTML(busy ? 'Landing' : 'Hold to land', ready, 'helicopter-landing', busy ? '' : '1.2 s')}<p class="msg">${msg}</p><div class="acts">${busy ? '' : '<button class="btn g" id="bAround">Go around</button>'}</div>`;
    const h = $('#dock .hold'); h.dataset.ph = busy ? 'b' : 's'; if (busy) { h.dataset.busy = '1'; h.style.setProperty('--p', 1); }
    bindHold(h, 1200, doLand, () => toast('That pad is occupied. Pick another one'));
    const b = $('#bAround'); if (b) b.onclick = () => { RUN++; padMarks.forEach(r => r.material.opacity = 0); S.fly.s = FPL; S.fly.active = true; setMode('flight'); S.phase = 'hold'; show(['trip', 'gSpd', 'gAlt', 'rulL', 'rulR', 'dock', 'sTL', 'sSL', 'sSR']); renderFlightDock(); toast('Holding at 1,500 ft over Pasadena'); };
  } else { ex.dataset.ready = ready; ex.setAttribute('aria-disabled', !ready); $('#dock .msg').innerHTML = msg; }
  setWhere('Over Pasadena'); setClock(14 * 60 + 47);
  padMarks.forEach((r, i) => r.material.opacity = busy ? 0 : PADS[i].id === p.id ? .7 : .25);
}
let DESC = null;
function doLand() {
  RUN++; S.phase = 'descent'; renderLand();
  const pad = PADPOS[PADS.findIndex(x => x.id === S.land.pad)], c = car.position.clone();
  const mid = c.clone().lerp(pad, .55); mid.y = 220;
  DESC = { curve: new T.CatmullRomCurve3([c, mid, pad.clone().setY(60), pad.clone().setY(8), pad.clone().setY(0)], false, 'centripetal'), t0: performance.now(), ms: RM ? 10 : 9000, yaw0: car.rotation.y };
}

  S.land.k = e; car.position.copy(DESC.curve.getPoint(e)); car.rotation.y = mix(DESC.yaw0, PAD_YAW, sm(.6, 1, e)); car.rotation.z *= .95;
  const ft = Math.round(car.position.y * 3.281 / 10) * 10; setClock(14 * 60 + 47 + e);

}
async function touchdown() {
  const run = RUN; S.phase = 'touch'; spinTarget = 0; toast(`Landed on ${S.land.pad}`);
  $('#dock .msg').innerHTML = '<b>Touchdown.</b> Rotors spinning down.';
  await sleep(2200); if (run !== RUN) return;
  foldTo(0, 1500); await sleep(1600); if (run !== RUN) return;

}

/* ================= reset / presets ================= */
function hideFlightBits() { gates.forEach(g => g.visible = false); traffic.visible = false; beam.visible = false; }
function resetAll() {
  RUN++; DESC = null; S.fly = { s: 0, v: 0, active: false }; S.corr = null; S.chk = {}; S.open = {}; S.phase = 'approach'; S.instr = false;
  S.drive = { u: 0, speed: 31, parked: false, leg: 'origin' }; spinTarget = 0; ud.spin(0); foldAnim = null; ud.setFold(0);
  car.position.copy(DRIVE_IN.getPointAt(0)); car.rotation.set(0, yawOf(DRIVE_IN.getTangentAt(0)), 0);

  enterDrive('origin'); updateCam(0, true); playIntro();
}
function presetLift() { DESC = null; S.fly.active = false; spinTarget = 0; ud.spin(0); ud.setFold(0); S.drive.parked = true; S.drive.leg = 'origin'; padMarks.forEach(r => r.material.opacity = 0); enterLift(); }
function presetFlight() {
  RUN++; DESC = null; S.corr = 'C9'; S.liftMin = 32; CHECKS.forEach(c => S.chk[c.id] = 'ok'); ud.setFold(1); spinTarget = 62; ud.spin(62);
  S.fly = { s: FPL * .2, v: 240, active: true }; car.position.copy(atS(S.fly.s)); car.rotation.set(0, Math.PI / 2, 0); padMarks.forEach(r => r.material.opacity = 0);
  S.phase = 'takeoff'; enterFlightUI(); updateCam(0, true);
}
function presetLand() {
  RUN++; DESC = null; if (!S.corr) S.corr = 'C9'; S.liftMin = CORR[S.corr].liftMin; ud.setFold(1); spinTarget = 62; ud.spin(62);
  S.fly = { s: FPL, v: 0, active: false }; car.position.copy(atS(FPL)); car.rotation.set(0, Math.PI / 2 - .45, 0); enterLand(); updateCam(0, true);
}
$$('.modes button').forEach(b => b.onclick = () => ({ drive: resetAll, lift: presetLift, flight: presetFlight, land: presetLand })[b.dataset.m]());
/* demo mode for recording: R restarts, 1-4 jump to Drive, Lift, Flight, Land */
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase(); const jump = { r: resetAll, 1: resetAll, 2: presetLift, 3: presetFlight, 4: presetLand }[k]; if (jump) { e.preventDefault(); jump(); } });

/* intro choreography */
function playIntro() {
  const order = ['.top', '#left', '#right', '#dock'];
  order.forEach((s, i) => { const e = $(s); if (!e || RM) return; e.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 700, delay: 150 + i * 110, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' }); });
}

/* ================= main loop ================= */
let last = performance.now(), frames = 0;
const DT_MAX = /qa=1/.test(location.search) ? .6 : .05;
let fpsT = performance.now(), fpsN = 0, lowFps = 0, degraded = false;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, DT_MAX); last = now; frames++; fpsN++;
  if (now - fpsT > 1000) { const fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsT = now; fpsN = 0;
    $('#hint').textContent = `R restart · 1–4 stages · ${fps} fps${degraded ? ', light mode' : ''}`;
    /* adaptive quality: after 3 slow seconds drop resolution and panel blur */
    lowFps = fps < 40 ? lowFps + 1 : 0; if (lowFps >= 3 && !degraded && !/qa=1/.test(location.search)) { degraded = true; R.setPixelRatio(1); resize(); document.documentElement.classList.add('noblur'); } }
  if (!window.__paused) tick(dt);
  const r0 = performance.now(); R.render(scene, cam); window.__rt = performance.now() - r0;
  if (!document.hidden) requestAnimationFrame(loop);
}
function tick(dt) {
  S.t += dt; const now = performance.now();
  // fold animation
  if (foldAnim) { const k = clamp((now - foldAnim.t0) / foldAnim.ms, 0, 1); ud.setFold(mix(foldAnim.from, foldAnim.to, k)); if (k >= 1) foldAnim = null; }
  // rotor speed
  const rate = mix(ud.rpm, spinTarget, 1 - Math.exp(-dt * (spinTarget > ud.rpm ? 1.6 : .9))); ud.spin(rate, dt);
  // drive
  if (S.mode === 'drive' && S.drive.leg === 'origin' && !S.drive.parked) {
    const d = S.drive; const len = DRIVE_IN.getLength(); const vms = Math.max(.5, d.speed * .447);
    d.u = Math.min(1, d.u + vms * dt / len); const rem = (1 - d.u) * len; d.speed = Math.min(31, Math.sqrt(5.2 * rem) / .447);
    car.position.copy(DRIVE_IN.getPointAt(d.u)); car.rotation.y = yawOf(DRIVE_IN.getTangentAt(d.u)); ud.roll && ud.roll(vms * dt);
    const ds = document.getElementById('dSpd'); if (ds) ds.textContent = Math.round(d.speed);
    if (d.u >= 1) { d.parked = true; d.speed = 0; car.rotation.y = PAD_YAW; renderDrive(); }
  }
  if (S.mode === 'drive' && S.drive.leg === 'dest' && S.phase === 'out' && OUT) {
    const d = S.drive, len = OUT.getLength(); d.speed = Math.min(14, d.speed + dt * 5); d.u = Math.min(1, d.u + d.speed * .447 * dt / len);
    ud.roll && ud.roll(d.speed * .447 * dt);
    car.position.copy(OUT.getPointAt(d.u)); car.rotation.y = mix(car.rotation.y, yawOf(OUT.getTangentAt(d.u)), 1 - Math.exp(-dt * 4));
    const ds = document.getElementById('dSpd'); if (ds) ds.textContent = Math.round(d.speed);
    if (d.u >= 1) { S.phase = 'arrived'; d.speed = 0; renderDrive(); }
    else if (S.phase === 'out' && !S._outRendered) { S._outRendered = true; }
  }
  flightUpdate(dt); landUpdate();
  if (S.phase === 'hold' && S.mode !== 'land') { car.position.y = 452 + Math.sin(S.t * .8) * .6; }
  // flight furniture
  const fl = S.mode === 'flight' || S.phase === 'takeoff';
  setRouteFrom(fl ? S.fly.s : 0); route.visible = fl && car.position.y > 330;
  beam.visible = fl || (S.mode === 'land' && S.phase === 'select'); const bp = S.mode === 'land' ? PADPOS[PADS.findIndex(p => p.id === S.land.pad)] : DEST; beam.position.set(bp.x, 350, bp.z);
  chevrons.forEach(c => c.visible = fl && S.fly.s < S_TURN + 100 && car.position.y > 300);
  gates.forEach((g, i) => { const s = S.fly.s + 260 + i * 380; const on = fl && car.position.y > 420 && s < S_APP; g.visible = on; if (!on) return; const p = atS(s), t = tanS(s); g.position.copy(p); g.lookAt(p.clone().add(t)); g.children.forEach(m => m.material.opacity = .75 - i * .2); });
  traffic.visible = fl && car.position.y > 300 && S.fly.s < S_APP; if (traffic.visible) { const tp = atS(Math.min(FPL, S.fly.s + 420)); const tt2 = tanS(S.fly.s + 420); traffic.position.set(tp.x - tt2.z * 140, tp.y + 18, tp.z + tt2.x * 140); traffic.rotation.y = yawOf(tt2); traffic.userData.spin(60, dt); }
  zoneRing.visible = S.mode === 'lift' && S.phase !== 'takeoff';
  // lights follow the car
  const cp = car.position; sun.position.set(cp.x - 16, cp.y + 30, cp.z - 14); sun.target.position.copy(cp);
  rimL.position.set(cp.x + 18, cp.y + 10, cp.z + 22); rimL.target.position.copy(cp);
  key.position.set(cp.x + 6, cp.y + 14, cp.z + 12); key.target.position.copy(cp);
  const gy = S.mode === 'drive' && S.drive.leg === 'dest' || (S.mode === 'land') ? 0 : 0;
  ao.position.set(cp.x, gy + .07, cp.z); ao.rotation.z = car.rotation.y; ao.material.opacity = 1 - sm(0, 8, cp.y);
  updateCam(dt, false); updateChips();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = performance.now(); requestAnimationFrame(loop); } });
window.__kestrel = { S, fps: () => frames, scene, cam, snap: () => updateCam(0, true), renderNow: () => { updateChips(); R.render(scene, cam); }, step: (n, dt = .05) => { for (let i = 0; i < n; i++) tick(dt); } };

/* ================= boot ================= */
addEventListener('resize', resize); resize();
if (/noblur=1/.test(location.search)) document.documentElement.classList.add('noblur');
const start = (location.hash.match(/#\/(\w+)/) || [])[1];
resetAll();
if (start === 'lift') presetLift(); else if (start === 'flight') presetFlight(); else if (start === 'land') presetLand();
document.fonts && document.fonts.ready.then(movePill);
$('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 700);
requestAnimationFrame(loop);
})();
</script></body></html>
