<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shots — Vitalii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3EF;--ink:#16181A;--ink2:#6B6E70;--line:#DDDBD4;--card:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F10;--ink:#ECEBE6;--ink2:#8D9093;--line:#25282A;--card:#16181A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F10;--ink:#ECEBE6;--ink2:#8D9093;--line:#25282A;--card:#16181A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(20px,4vw,40px)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:32px}
h1{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.02em;margin:0}
header p{margin:0;color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:32px 24px}
a.card{display:block;color:inherit;text-decoration:none;border-radius:14px;outline-offset:4px}
a.card:focus-visible{outline:2px solid var(--ink)}
.thumb{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
a.card:hover .thumb img{transform:scale(1.025)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.meta b{font-weight:600}
.meta span{color:var(--ink2)}
footer{margin-top:56px;color:var(--ink2);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Shots</h1><p>Working interfaces behind my Dribbble concepts</p></header>
<main class="grid">
  <a class="card" href="2026-10-kestrel/">
    <div class="thumb"><img src="2026-10-kestrel/screenshots/cover.png" alt="Kestrel, a cockpit display for a roadable eVTOL" loading="lazy"></div>
    <div class="meta"><span><b>Kestrel</b> · Mobility / eVTOL</span><span>Oct 2026</span></div>
  </a>
  <a class="card" href="2026-10-tidewell/">
    <div class="thumb"><img src="2026-10-tidewell/screenshots/cover.png" alt="Tidewell, a dynamic energy tariff planner" loading="lazy"></div>
    <div class="meta"><span><b>Tidewell</b> · Energy / home</span><span>Oct 2026</span></div>
  </a>
</main>
<footer>Concept work by Vitalii. Products, names and data are fictional.</footer>
</div>
</body>
</html>
